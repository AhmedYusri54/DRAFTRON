[project]
name = "draftron"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.0",
    "langchain-openai",
    "langchain-groq",
    "langgraph-checkpoint-sqlite",
    "streamlit",
    "pydantic>=2",
    "python-dotenv",
]

[tool.setuptools]
packages = ["graph", "graph.nodes", "models"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
